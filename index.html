<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Be My Valentine? 💝</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px 20px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
        }

        @media (min-width: 768px) {
            .container {
                padding: 60px 40px;
            }
        }

        h1 {
            font-size: 2.5em;
            color: #e91e63;
            margin-bottom: 20px;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        .question {
            font-size: 1.4em;
            color: #333;
            margin-bottom: 30px;
            font-weight: 600;
        }

        @media (min-width: 768px) {
            h1 {
                font-size: 3em;
            }
            .question {
                font-size: 1.8em;
                margin-bottom: 40px;
            }
        }

        .buttons {
            display: flex;
            gap: 60px;
            justify-content: center;
            align-items: center;
            position: relative;
            min-height: 200px;
        }

        button {
            padding: 12px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        @media (min-width: 768px) {
            button {
                padding: 15px 40px;
                font-size: 1.2em;
            }
        }

        #yesBtn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            position: absolute;
        }

        #yesBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.4);
        }

        #noBtn {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            color: #666;
            position: fixed;
            transition: all 0.2s ease;
            z-index: 1000;
        }

        #noBtn:hover {
            background: linear-gradient(135deg, #fed6e3 0%, #a8edea 100%);
        }

        .success {
            display: none;
        }

        .success.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .success h2 {
            font-size: 2.5em;
            color: #e91e63;
            margin-bottom: 20px;
        }

        .success p {
            font-size: 1.3em;
            color: #666;
        }

        .hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            font-size: 2em;
            animation: float 4s ease-in infinite;
            opacity: 0;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .gif-container {
            margin: 20px 0;
        }

        .gif-container img {
            max-width: 200px;
            border-radius: 15px;
        }
    </style>
</head>
<body>
    <div class="hearts" id="hearts"></div>
    
    <div class="container">
        <div id="question-section">
            <h1>💝</h1>
            <p class="question">Juls, will you be my Valentine?</p>
            <div class="gif-container">
                <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExZ3E3bXpkMjM1b212NnA2a2IzeTIyN3VyZDg1NW0zemE1aWhnYzUzdSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/MDJ9IbxxvDUQM/giphy.gif" alt="Cute puppy">
            </div>
            <div class="buttons">
                <button id="yesBtn" onclick="sayYes()">Yes! 💕</button>
                <button id="noBtn">No</button>
            </div>
        </div>

        <div id="success-section" class="success">
            <h2>Yay! 🎉💖</h2>
            <p>I'm so happy! You just made my day! 😊</p>
            <div class="gif-container">
                <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExMnprcXE3YnBhZ2xiam9nNzEzcjdibXM1cG01MDB2bXJlOTJmZW1ncCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/pyQtiutcKXwbKwF96g/giphy.gif" alt="Happy celebration">
            </div>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const container = document.querySelector('.container');
        let clickCount = 0;

        // Add event listeners for both mouse and touch events
        noBtn.addEventListener('mouseenter', moveButton);
        noBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            moveButton();
        });
        noBtn.addEventListener('click', function(e) {
            e.preventDefault();
            moveButton();
        });

        function moveButton() {
            clickCount++;
            
            // Get button dimensions
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;
            
            // Use entire viewport
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;
            
            // Calculate safe bounds (keeping button fully visible with padding)
            const padding = 20;
            const maxX = viewportWidth - btnWidth - padding;
            const maxY = viewportHeight - btnHeight - padding;
            
            // Generate random position anywhere on screen
            const randomX = Math.max(padding, Math.random() * maxX);
            const randomY = Math.max(padding, Math.random() * maxY);
            
            // Move the button
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
            noBtn.style.transform = 'translate(0, 0)';
            
            // Make the button smaller and faster each time
            const newSize = Math.max(0.5, 1 - (clickCount * 0.06));
            noBtn.style.transform = `scale(${newSize})`;
            
            // Speed up transition as user tries more
            const speed = Math.max(0.1, 0.2 - (clickCount * 0.01));
            noBtn.style.transition = `all ${speed}s ease`;
            
            // Change text to tease the user
            if (clickCount > 3) {
                noBtn.textContent = '🏃‍♂️';
            }
            if (clickCount > 7) {
                noBtn.textContent = '😏 Nope';
            }
            if (clickCount > 12) {
                noBtn.textContent = '😂';
            }
        }

        function sayYes() {
            document.getElementById('question-section').style.display = 'none';
            document.getElementById('success-section').classList.add('show');
            
            // Create falling hearts
            createHearts();
        }

        function createHearts() {
            const heartsContainer = document.getElementById('hearts');
            const heartSymbols = ['💕', '💖', '💗', '💘', '💝', '❤️', '🌹'];
            
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart';
                    heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.animationDelay = Math.random() * 2 + 's';
                    heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
                    heartsContainer.appendChild(heart);
                    
                    setTimeout(() => heart.remove(), 7000);
                }, i * 200);
            }
        }

        // Initialize button positions - both start in the container proportionally
        const yesBtn = document.getElementById('yesBtn');
        yesBtn.style.position = 'absolute';
        
        // Position No button proportionally to match Yes button size and spacing
        // Calculate position relative to container, then convert to viewport coordinates
        function positionNoButton() {
            const containerRect = container.getBoundingClientRect();
            const buttonsArea = document.querySelector('.buttons').getBoundingClientRect();
            
            // Different positioning for mobile vs desktop
            const isMobile = window.innerWidth < 768;
            
            if (isMobile) {
                // Mobile: stack vertically (Yes on top, No on bottom)
                yesBtn.style.left = '50%';
                yesBtn.style.top = '30%';
                yesBtn.style.transform = 'translate(-50%, -50%)';
                
                const initialLeft = containerRect.left + (containerRect.width * 0.5);
                const initialTop = buttonsArea.top + (buttonsArea.height * 0.70);
                
                noBtn.style.left = initialLeft + 'px';
                noBtn.style.top = initialTop + 'px';
                noBtn.style.transform = 'translate(-50%, -50%)';
            } else {
                // Desktop: side by side
                yesBtn.style.left = '20%';
                yesBtn.style.top = '50%';
                yesBtn.style.transform = 'translate(-50%, -50%)';
                
                const initialLeft = containerRect.left + (containerRect.width * 0.80);
                const initialTop = buttonsArea.top + (buttonsArea.height / 2);
                
                noBtn.style.left = initialLeft + 'px';
                noBtn.style.top = initialTop + 'px';
                noBtn.style.transform = 'translate(-50%, -50%)';
            }
        }
        
        positionNoButton();
        
        // Reposition on resize to maintain proportional positioning
        window.addEventListener('resize', positionNoButton);
    </script>
</body>
</html>
