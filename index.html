<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine? 💝</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            font-size: 3em;
            color: #e91e63;
            margin-bottom: 20px;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        .question {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 40px;
            font-weight: 600;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            position: relative;
            min-height: 200px;
        }

        button {
            padding: 15px 40px;
            font-size: 1.2em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        #yesBtn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        #yesBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.4);
        }

        #noBtn {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            color: #666;
            position: absolute;
            transition: all 0.15s ease;
        }

        #noBtn:hover {
            background: linear-gradient(135deg, #fed6e3 0%, #a8edea 100%);
        }

        .success {
            display: none;
        }

        .success.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .success h2 {
            font-size: 2.5em;
            color: #e91e63;
            margin-bottom: 20px;
        }

        .success p {
            font-size: 1.3em;
            color: #666;
        }

        .hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            font-size: 2em;
            animation: float 4s ease-in infinite;
            opacity: 0;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .gif-container {
            margin: 20px 0;
        }

        .gif-container img {
            max-width: 200px;
            border-radius: 15px;
        }
    </style>
</head>
<body>
    <div class="hearts" id="hearts"></div>
    
    <div class="container">
        <div id="question-section">
            <h1>💝</h1>
            <p class="question">Juls, will you be my Valentine?</p>
            <div class="gif-container">
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExcHB5bnBxdGRqYzc4MXVpOGl0b3FycTF3OWZmemJxaHNkdGt6cWZveSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/MDJ9IbxxvDUQM/giphy.gif" alt="Cute puppy">
            </div>
            <div class="buttons">
                <button id="yesBtn" onclick="sayYes()">Yes! 💕</button>
                <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No</button>
            </div>
        </div>

        <div id="success-section" class="success">
            <h2>Yay! 🎉💖</h2>
            <p>I'm so happy! You just made my day! 😊</p>
            <div class="gif-container">
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExZGdpMGMzdHdzYnI1dWIweHY1aDM3MnhsaGdmcTQweXNjZDdwbWVkMyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/L0O3TQpp0dtduHCW9q/giphy.gif" alt="Happy celebration">
            </div>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const container = document.querySelector('.container');
        let clickCount = 0;

        function moveButton() {
            clickCount++;
            
            // Get button dimensions
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;
            
            // Get container dimensions (using the buttons div as reference for safe area)
            const buttonsDiv = document.querySelector('.buttons');
            const containerWidth = container.offsetWidth - 80; // padding on both sides
            const containerHeight = buttonsDiv.offsetHeight;
            
            // Calculate safe bounds (keeping button fully visible)
            const maxX = containerWidth - btnWidth;
            const maxY = containerHeight - btnHeight;
            
            // Ensure minimum spacing from edges
            const minX = 20;
            const minY = 0;
            
            // Generate random position within safe bounds
            const randomX = Math.max(minX, Math.min(maxX, Math.random() * containerWidth));
            const randomY = Math.max(minY, Math.min(maxY, Math.random() * containerHeight));
            
            // Move the button
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
            
            // Make the button smaller each time (for fun)
            const newSize = Math.max(0.6, 1 - (clickCount * 0.08));
            noBtn.style.transform = `scale(${newSize})`;
            
            // After several attempts, make it change text
            if (clickCount > 5) {
                noBtn.textContent = '😏';
            }
            if (clickCount > 10) {
                noBtn.textContent = 'Nope!';
            }
        }

        function sayYes() {
            document.getElementById('question-section').style.display = 'none';
            document.getElementById('success-section').classList.add('show');
            
            // Create falling hearts
            createHearts();
        }

        function createHearts() {
            const heartsContainer = document.getElementById('hearts');
            const heartSymbols = ['💕', '💖', '💗', '💘', '💝', '❤️', '🌹'];
            
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart';
                    heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.animationDelay = Math.random() * 2 + 's';
                    heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
                    heartsContainer.appendChild(heart);
                    
                    setTimeout(() => heart.remove(), 7000);
                }, i * 200);
            }
        }

        // Initialize no button position
        noBtn.style.position = 'absolute';
        noBtn.style.left = '60%';
        noBtn.style.top = '50%';
        noBtn.style.transform = 'translate(-50%, -50%)';
    </script>
</body>
</html>
